<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" width="1000" height="170"><style>
text{font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
.m{font-family:'Cascadia Code',Consolas,ui-monospace,monospace}
.fade{opacity:0;animation:fade .6s ease-out forwards}
@keyframes fade{to{opacity:1}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.shim{animation:shim 1.8s ease-in-out infinite}
@keyframes shim{50%{opacity:.45}}
</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#60a5fa"/></linearGradient><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#30363d"/></pattern></defs><rect width="1000" height="170" rx="16" fill="#0d1117"/><rect width="1000" height="170" rx="16" fill="url(#grid)"/><rect x=".5" y=".5" width="999" height="169" rx="16" fill="none" stroke="#30363d"/><rect x="1" y="1" width="998" height="168" rx="15" fill="none" stroke="url(#g)" stroke-width="1.5" stroke-opacity=".7"/><circle class="pulse" cx="48" cy="48" r="6" fill="#a3e635"/><text x="64" y="53" class="m" font-size="13" fill="#a3e635">open to collaborate</text><text x="40" y="100" font-size="26" font-weight="800" fill="#e6edf3">Got an interesting open-source project?</text><text x="40" y="132" font-size="16" fill="#8b949e">I care about the code <tspan fill="#8b5cf6">and</tspan> how it feels to use. Assign me.</text><g><animateTransform attributeName="transform" type="translate" values="840,40;800,95;860,70;840,40" dur="6s" repeatCount="indefinite"/><path d="M0 0 L0 18 L5 14 L9 22 L12 20.5 L8 13 L15 13 Z" fill="#8b5cf6" stroke="#0d1117"/><rect x="14" y="20" width="46" height="20" rx="10" fill="#8b5cf6"/><text x="37" y="34" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">You?</text></g></svg>