<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330"><style>
text{font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
.m{font-family:'Cascadia Code',Consolas,ui-monospace,monospace}
.fade{opacity:0;animation:fade .6s ease-out forwards}
@keyframes fade{to{opacity:1}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.shim{animation:shim 1.8s ease-in-out infinite}
@keyframes shim{50%{opacity:.45}}
</style><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#30363d"/></pattern></defs><rect width="1000" height="330" rx="16" fill="#0d1117"/><rect width="1000" height="330" rx="16" fill="url(#grid)"/><rect x=".5" y=".5" width="999" height="329" rx="16" fill="none" stroke="#30363d"/><rect x="24" y="24" width="296" height="282" rx="12" fill="#161b22" stroke="#30363d"/><circle cx="44" cy="50" r="5" fill="#8b5cf6"/><text x="58" y="55" font-size="14" font-weight="700" fill="#e6edf3">In progress</text><text x="296" y="55" text-anchor="end" class="m" font-size="12" fill="#8b949e">2</text><rect x="38" y="74" width="268" height="100" rx="10" fill="#0d1117" stroke="#30363d"/><rect x="38" y="74" width="4" height="100" rx="2" fill="#8b5cf6"/><text x="56" y="100" class="m" font-size="15" font-weight="700" fill="#e6edf3">chaos-ai</text><text x="56" y="121" font-size="12" fill="#8b949e">Resilience testing for agentic AI,</text><text x="56" y="137" font-size="12" fill="#8b949e">with a feasibility study.</text><text x="56" y="161" class="m" font-size="10.5" fill="#8b5cf6">Research · Python</text><rect x="38" y="182" width="268" height="100" rx="10" fill="#0d1117" stroke="#30363d"/><rect x="38" y="182" width="4" height="100" rx="2" fill="#8b5cf6"/><text x="56" y="208" class="m" font-size="15" font-weight="700" fill="#e6edf3">Star_bridge</text><text x="56" y="229" font-size="12" fill="#8b949e">Robots that find each other, share</text><text x="56" y="245" font-size="12" fill="#8b949e">events and show it on their faces.</text><text x="56" y="269" class="m" font-size="10.5" fill="#8b5cf6">ESP-NOW · NodeMCU · C++</text><rect x="344" y="24" width="296" height="282" rx="12" fill="#161b22" stroke="#30363d"/><circle cx="364" cy="50" r="5" fill="#a3e635"/><text x="378" y="55" font-size="14" font-weight="700" fill="#e6edf3">Done</text><text x="616" y="55" text-anchor="end" class="m" font-size="12" fill="#8b949e">2</text><rect x="358" y="74" width="268" height="100" rx="10" fill="#0d1117" stroke="#30363d"/><rect x="358" y="74" width="4" height="100" rx="2" fill="#a3e635"/><text x="376" y="100" class="m" font-size="15" font-weight="700" fill="#e6edf3">SDLC</text><text x="376" y="121" font-size="12" fill="#8b949e">Attendance dashboard with login,</text><text x="376" y="137" font-size="12" fill="#8b949e">built end to end.</text><text x="376" y="161" class="m" font-size="10.5" fill="#a3e635">React · TypeScript · Vite</text><rect x="358" y="182" width="268" height="100" rx="10" fill="#0d1117" stroke="#30363d"/><rect x="358" y="182" width="4" height="100" rx="2" fill="#a3e635"/><text x="376" y="208" class="m" font-size="15" font-weight="700" fill="#e6edf3">DQC</text><text x="376" y="229" font-size="12" fill="#8b949e">Checks object-detection datasets for</text><text x="376" y="245" font-size="12" fill="#8b949e">bad files, labels and tiny objects.</text><text x="376" y="269" class="m" font-size="10.5" fill="#a3e635">Python · YOLO · CI</text><rect x="664" y="24" width="296" height="282" rx="12" fill="#161b22" stroke="#30363d"/><circle cx="684" cy="50" r="5" fill="#60a5fa"/><text x="698" y="55" font-size="14" font-weight="700" fill="#e6edf3">Up next</text><text x="936" y="55" text-anchor="end" class="m" font-size="12" fill="#8b949e">+</text><rect x="678" y="74" width="268" height="94" rx="10" fill="none" stroke="#60a5fa" stroke-dasharray="5 5"/><text x="812" y="116" text-anchor="middle" font-size="14" fill="#60a5fa">Your idea here?</text><text x="812" y="138" text-anchor="middle" class="m" font-size="11.5" fill="#8b949e">let's build it together</text><g><animateTransform attributeName="transform" type="translate" values="600,230;330,120;620,200;600,230" dur="9s" repeatCount="indefinite"/><path d="M0 0 L0 18 L5 14 L9 22 L12 20.5 L8 13 L15 13 Z" fill="#a3e635" stroke="#0d1117"/><rect x="14" y="20" width="56" height="20" rx="10" fill="#a3e635"/><text x="42" y="34" text-anchor="middle" font-size="12" font-weight="700" fill="#0d1117">Ariyan</text></g></svg>